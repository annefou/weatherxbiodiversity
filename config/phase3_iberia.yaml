# Soroye et al. (2020) replication on Iberian Bombus, with ERA5 climate.
# Parameters for each workflow under workflows/; read by the Snakefile.
# Credentials: copy credentials/*.example.json to credentials/*.json and fill in.

# Results of this run, under soroye_port/ (gitignored)
run_subdir: run/phase3_era5

gbif:                                      # workflows/GBIF_Retrieval
  # Existing GBIF download to fetch (public, no login): the citable snapshot
  # DOI 10.15468/dl.3frmsq. Set to "" to request a new download with the
  # filters below (needs credentials_file).
  download_key: "0006204-260423192947929"
  taxon_key: 1340278                       # genus Bombus
  countries: [ES, PT]
  has_coordinate: true
  has_geospatial_issue: false
  credentials_file: credentials/gbif_credentials.json
  output_dir: data/gbif
  poll_interval_sec: 30
  poll_timeout_sec: 3600

era5:                                      # workflows/ERA5_Retrieval
  years: [1940, 2014]                      # ERA5 starts in 1940
  # Source: ECMWF's hourly ARCO store (reanalysis-era5-single-levels); daily and
  # monthly statistics are both computed from the hourly values.
  frequency: monthly                       # monthly (one file per variable/statistic)
                                           # or daily (one file per year)
  # Statistics per variable, from hourly data (UTC days):
  #   monthly: mean, sum, daily_min_mean, daily_max_mean, daily_max_max
  #   daily:   mean, sum, min, max
  variables:
    t2m: [mean, daily_min_mean, daily_max_mean]
    tp: [sum]
  # Region: "occurrences" = only the 1 x 1 degree store tiles within `buffer`
  # degrees of the GBIF records; or a box [north, west, south, east].
  area: occurrences
  buffer: 1.0
  credentials_file: credentials/cds_credentials.json
  output_dir: data/era5

climate:                                   # input of workflows/Analysis
  # Monthly climate in the common climate input format (workflows/CLIMATE_INPUT.md).
  # To use another source (e.g. Destination Earth Climate DT, CMIP6), produce the
  # same files with that source's retrieval + preprocessing and change these lines.
  source: era5                             # label: files are <source>_<var>_monthly_*.nc
  dir: data/era5_climate                   # written by workflows/ERA5_Preprocessing
  baseline_years: [1940, 1974]             # Soroye: 1901-1974; ERA5 starts in 1940
  recent_years: [2000, 2014]
